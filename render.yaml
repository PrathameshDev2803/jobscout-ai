services:
  - type: web
    name: jobscout-ai
    runtime: docker
    region: singapore
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /_stcore/health
    autoDeployTrigger: commit
    envVars:
      - key: JOBS_DATA_DIR
        value: /tmp/jobscout
      - key: GEMINI_PUBLIC_API_KEY
        sync: false
