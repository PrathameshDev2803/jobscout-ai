[theme]
primaryColor = "#10b981"
backgroundColor = "#0b0f17"
secondaryBackgroundColor = "#131b2e"
textColor = "#e2e8f0"
font = "sans serif"

[server]
headless = true
enableCORS = true
enableXsrfProtection = true
runOnSave = true
folderWatchBlacklist = [".venv", "venv", ".git", "__pycache__", ".tempmediaStorage", ".system_generated"]

[browser]
gatherUsageStats = false

[client]
showErrorDetails = false
toolbarMode = "minimal"
